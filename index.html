<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scaffold для учителей</title>
<style>
/* Layout: a card table. Header with language switch, four tabs, and one working area that holds a card grid, a quiz card or a lesson-building board. */
:root{
  --bg:#eceff1; --surface:#fbfcfc; --surface2:#e2e8eb; --ink:#17212a; --muted:#55636e; --line:#cfd7dc;
  --accent:#1f6c78; --accent-ink:#ffffff; --accent-soft:#d6eaed;
  --good:#17703f; --good-bg:#dcf2e5; --bad:#a93425; --bad-bg:#f8e1dd;
  --c-d:#e98a2b; --on-d:#17212a; --c-e:#8a63b8; --on-e:#ffffff; --c-g:#5fb97b; --on-g:#17212a;
  --c-i:#b5cf4c; --on-i:#17212a; --c-x:#1f6c78; --on-x:#ffffff;
  --band-task:#4d6478; --band-plan:#7a6a4f; --band-teach:#2f5d8a; --band-assess:#8a4358; --band-algo:#3a4650;
  --font-display:'Rubik', 'Arial', sans-serif; --font-body:'Nunito Sans', 'Arial', sans-serif;
  --shadow:0 1px 2px rgba(23,33,42,.08), 0 6px 18px rgba(23,33,42,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --surface:#1a232a; --surface2:#242f37; --ink:#e8eef2; --muted:#98a6b1; --line:#2f3d47;
    --accent:#62b8c6; --accent-ink:#0e1a1f; --accent-soft:#1d3b41;
    --good:#5bc58a; --good-bg:#16301f; --bad:#f08a7a; --bad-bg:#3a1f1b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a232a; --surface2:#242f37; --ink:#e8eef2; --muted:#98a6b1; --line:#2f3d47;
  --accent:#62b8c6; --accent-ink:#0e1a1f; --accent-soft:#1d3b41;
  --good:#5bc58a; --good-bg:#16301f; --bad:#f08a7a; --bad-bg:#3a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:20px;padding-block:20px 48px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:1.65rem;font-weight:700}
.brand span{color:var(--muted);font-size:.9rem}
.top-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lvl{display:flex;flex-direction:column;gap:2px;min-width:7.5rem;font-size:.8rem;color:var(--muted)}
.lvl b{color:var(--ink);font-family:var(--font-display);font-size:.95rem}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:.4rem .8rem;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:transparent;padding:.7rem 1rem;font-family:var(--font-display);font-weight:600;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.lead{color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;font-weight:600;margin-left:.3rem}
.search{width:100%;max-width:26rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.5rem),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.card.btn{width:100%}
.card.btn:hover{border-color:var(--accent)}
.card.open{grid-column:1/-1}
.cc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:.55rem .9rem;background:var(--cat,var(--band-algo));color:var(--on-cat,#fff)}
.cc-code{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.1}
.cc-frame{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cc-body{display:flex;flex-direction:column;gap:8px;padding:.8rem .9rem 1rem;flex:1}
.cc-name{font-family:var(--font-display);font-weight:600;font-size:1.02rem;line-height:1.25}
.cc-desc{font-size:.93rem;color:var(--muted)}

.cat-d{--cat:var(--c-d);--on-cat:var(--on-d)} .cat-e{--cat:var(--c-e);--on-cat:var(--on-e)}
.cat-g{--cat:var(--c-g);--on-cat:var(--on-g)} .cat-I{--cat:var(--c-i);--on-cat:var(--on-i)}
.band-task{--cat:var(--band-task)} .band-plan{--cat:var(--band-plan)} .band-teach{--cat:var(--band-teach)} .band-assess{--cat:var(--band-assess)} .band-algo{--cat:var(--band-algo)} .band-cross{--cat:var(--c-x)}
.cc-code svg{width:18px;height:18px;vertical-align:middle;display:block}
.pic.sq{aspect-ratio:1/1;max-height:15rem;margin-inline:auto;width:auto;max-width:100%}
.qpic.sq{aspect-ratio:1/1;max-width:13rem;width:13rem}

.opt.imgopt .pic.sq{max-height:none;width:100%}
.sym{display:inline-flex;align-items:center;gap:5px;color:var(--c-x);font-size:.85rem;font-weight:600}
:root[data-theme="dark"] .sym{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sym{color:var(--accent)}}
.sym svg{width:20px;height:20px;flex:none}
.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.hint{font-size:.85rem;color:var(--muted)}
.btnp{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:.65rem 1.2rem;font-weight:700}
.btnp[disabled]{opacity:.45;cursor:not-allowed}
.btng{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem 1.1rem;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);text-align:left;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode h3{font-size:1.05rem;font-weight:600}
.mode p{font-size:.9rem;color:var(--muted);flex:1}
.mode .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mode.feat{background:var(--accent-soft);border-color:var(--accent)}
.qwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qprompt{font-family:var(--font-display);font-size:clamp(1.1rem,2.6vw,1.45rem);font-weight:500;line-height:1.35;max-width:62ch}
.qsub{font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.7rem .9rem;text-align:left;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;font-family:var(--font-display);font-weight:700;width:1.6rem;height:1.6rem;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.symopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:10px}
.symopts .opt{align-items:center}
.symopts svg{width:26px;height:26px;flex:none;color:var(--c-x)}
:root[data-theme="dark"] .symopts svg{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .symopts svg{color:var(--accent)}}
.fb{border-radius:12px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.fb.good{background:var(--good-bg);color:var(--ink)} .fb.bad{background:var(--bad-bg);color:var(--ink)}
.fb b.t{font-family:var(--font-display)}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.sum{display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.miss div{border-left:3px solid var(--bad);padding-left:.7rem}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.chipstep{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .8rem;text-align:left;font-size:.95rem;flex:1 1 16rem;min-width:0}
.chipstep:hover{border-color:var(--accent)}
.chipstep.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.chipstep.shake{animation:none}}
.slots{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.slot{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;min-height:2.6rem;font-size:.95rem}
.slot .n{flex:none;font-family:var(--font-display);font-weight:700;color:var(--muted);width:1.4rem}
.slot.fill{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.lab-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.6vw,22px);display:flex;flex-direction:column;gap:12px;min-width:0}
.lab-sec h3{font-size:1.1rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.sel-count{font-variant-numeric:tabular-nums;font-weight:700}
.scn{background:var(--ink);color:var(--bg);border-radius:16px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:8px}
.scn h2{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:600}
.scn p{opacity:.88;font-size:.95rem}
.scn .eyebrow{color:var(--accent-soft)}
.scn ul{margin:0;padding-left:1.1rem;font-size:.93rem;opacity:.88}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:10px}
.cpick{padding:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;display:flex;flex-direction:column;min-width:0}
.cpick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cpick[disabled]{opacity:.5;cursor:not-allowed}
.cpick .cc-top{padding:.4rem .75rem}.cpick .cc-code{font-size:1.2rem}
.cpick .cc-body{padding:.6rem .75rem .8rem;gap:6px}
.cpick .cc-name{font-size:.95rem}.cpick .cc-desc{font-size:.85rem}
.syms-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr));gap:10px}
.syms-pick .opt{align-items:center}
.syms-pick svg{width:24px;height:24px;flex:none;color:var(--c-x)}
:root[data-theme="dark"] .syms-pick svg{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .syms-pick svg{color:var(--accent)}}
.on-n{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.res{display:flex;flex-direction:column;gap:10px}
.res-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:var(--surface)}
.res-row .ic{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.ic.ok{background:var(--good);color:var(--bg)} .ic.part{background:var(--c-d);color:#17212a} .ic.no{background:var(--bad);color:var(--bg)}
.res-row .rt{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.93rem}
.res-row .rt b{font-family:var(--font-display)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.82rem;color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr 4.5rem;gap:12px;align-items:center;font-size:.92rem}
.mrow .nm{min-width:0}
.mrow .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:560px){.mrow{grid-template-columns:1fr 3.5rem}.mrow .bar{grid-column:1/-1;grid-row:2}}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:12px}
.weak{display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.weak div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.weak em{font-style:normal;color:var(--muted);font-size:.82rem;white-space:nowrap}
.algo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.algo li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.algo .n{flex:none;font-family:var(--font-display);font-weight:700;font-size:1.2rem;width:2rem;height:2rem;border-radius:50%;background:var(--band-algo);color:#fff;display:grid;place-items:center}
.pic{display:block;width:100%;height:auto;aspect-ratio:360/228;object-fit:cover;background:var(--surface2)}
.pic.wide{aspect-ratio:560/193}
.card.open .pic{max-width:30rem}
.qpic{display:block;width:100%;max-width:26rem;height:auto;aspect-ratio:360/228;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.picopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:44rem}
@media (min-width:640px){.picopts.sq{grid-template-columns:repeat(4,minmax(0,1fr));max-width:40rem}}
.opt.imgopt{padding:0;position:relative;overflow:hidden;align-items:stretch}
.opt.imgopt .k{position:absolute;left:8px;top:8px;background:rgba(10,18,24,.72);color:#fff}
.opt.imgopt .pic{border-radius:10px}
.fbrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fbpic{width:min(100%,13rem);height:auto;aspect-ratio:360/228;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.fbtxt{display:flex;flex-direction:column;gap:6px;flex:1 1 14rem;min-width:0}
.integ{display:flex;flex-direction:column;gap:6px}
.ichip{font-family:var(--font-display);font-weight:700;font-size:.8rem;padding:.15rem .5rem;border-radius:6px;background:var(--cat);color:var(--on-cat)}
.plan-ta{width:100%;font-family:var(--font-body);font-size:.92rem;line-height:1.5;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:.7rem .8rem;resize:vertical}
.empty{color:var(--muted);padding:1rem 0}
.ex-steps{display:flex;gap:8px;flex-wrap:wrap}
.ex-dot{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:700}
.ex-dot.done{background:var(--surface2)}
.ex-dot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ex-head h2{font-size:clamp(1.2rem,2.8vw,1.6rem);font-weight:600}
.ex-two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:760px){.ex-two{grid-template-columns:minmax(0,22rem) minmax(0,1fr)}}
.ex-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.6vw,20px);display:flex;flex-direction:column;gap:10px;min-width:0}
.ex-list{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:8px}
.ex-list li span{color:var(--muted);font-size:.93rem}
.ex-cross{display:flex;flex-wrap:wrap;gap:12px}

.xpic{width:3.6rem;height:3.6rem;border-radius:10px;display:block}
.ex-ind{display:flex;flex-direction:column;gap:8px}
.ex-irow{display:flex;gap:10px;align-items:center}
.ex-prod{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px}
.ex-prod .eyebrow{color:var(--accent-soft)}
.ex-tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ex-tbl{border-collapse:collapse;width:100%;min-width:34rem;font-size:.93rem}
.ex-tbl th,.ex-tbl td{text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
.ex-tbl th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex-min{font-family:var(--font-display);font-weight:700;white-space:nowrap}
.tbadge{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:.15rem .55rem;border-radius:999px}
.tbadge.ok{background:var(--good-bg);color:var(--good)} .tbadge.no{background:var(--surface2);color:var(--muted)}
.mode.tpassed{border-color:var(--good)}
.verdict{border-radius:14px;padding:.9rem 1.1rem;display:flex;flex-direction:column;gap:4px}
.verdict.good{background:var(--good-bg)} .verdict.bad{background:var(--bad-bg)}
</style>

<div id="app"></div>
<script>/* ============================================================
   SCAFFOLD — разметка КСП «Физика» (10 класс) по инструменту Scaffold
   Источники: набор карточек Scaffold (ETF / JRC, рус. и каз. версии),
   учебно-методические материалы НАО «Talap» «Проектирование учебных
   занятий с применением инструмента Scaffold».
   Структура: 57 карточек компетенций (DigComp d.1–d.21, EntreComp e.1–e.15,
   GreenComp g.1–g.12, LifeComp I.1–I.9), 7 сквозных компетенций, 7 методов
   обучения, 7 методов оценки, 8 карточек «Задание», 7 карточек «Планирование».
   ============================================================ */
(function (root) {
  "use strict";

  // сквозные компетенции урока — символы, общие минимум для двух выбранных карточек
  // (принцип Scaffold: карточки с одним символом развивают одну и ту же сквозную компетенцию)
  var CROSS_ORDER = ["crit","prob","team","comm","anal","crea","inter"];
  // не более двух сквозных компетенций на урок: берём символы, чаще всего встречающиеся на выбранных карточках,
  // с поправкой на метод обучения (какие сквозные компетенции он развивает в первую очередь)
  var METHOD_CROSS = { proj: ["prob","crea"], pers: ["crit","crea"], value: ["crea","inter"], coop: ["team","comm"], game: ["team","crea"], lab: ["prob","anal"], serv: ["team","inter"] };
  var CROSS_MAX = 2;
  function crossFor(codes, teach) {
    var cnt = {};
    codes.forEach(function (c) { (COMP[c].cross || []).forEach(function (x) { cnt[x] = (cnt[x] || 0) + 1; }); });
    (teach || []).forEach(function (t) { (METHOD_CROSS[t] || []).forEach(function (x) { if (cnt[x]) cnt[x] += 1; }); });
    return CROSS_ORDER
      .map(function (k, i) { return { k: k, n: cnt[k] || 0, i: i }; })
      .filter(function (o) { return o.n >= 2; })
      .sort(function (a, b) { return b.n - a.n || a.i - b.i; })
      .slice(0, CROSS_MAX)
      .map(function (o) { return o.k; })
      .sort(function (a, b) { return CROSS_ORDER.indexOf(a) - CROSS_ORDER.indexOf(b); });
  }
  var CROSS_FIXED = { 20: ["prob","team"] };

  Object.keys(LESSON_MAP).forEach(function (id) {
    var m = LESSON_MAP[id];
    m.cross = CROSS_FIXED[id] || crossFor(m.comps, m.teach);
  });

  var SC = {
    CROSS: CROSS, CROSS_ORDER: CROSS_ORDER, CAT: CAT, COMP: COMP, COMP_ORDER: COMP_ORDER,
    TEACH: TEACH, TEACH_ORDER: ["proj","pers","value","coop","game","lab","serv"],
    ASSESS: ASSESS, ASSESS_ORDER: ["peer","self","data","auth","auto","obs","quest"],
    TASKCARDS: TASKCARDS, PLANCARDS: PLANCARDS, STEPS: STEPS, LESSON_MAP: LESSON_MAP,
    forLesson: function (id) { return LESSON_MAP[id]; }
  };


  /* ---- Разметка этапов урока: компетенции и метод оценки на каждом этапе ---- */
  var STAGE_TYPE = {
    diag: { ru: "диагностическое", kz: "диагностикалық" },
    form: { ru: "формирующее",     kz: "қалыптастырушы" },
    summ: { ru: "суммативное",     kz: "жиынтық" }
  };
  function stageMap(id) {
    var m = LESSON_MAP[id];
    if (!m) return null;
    var cs = m.comps;
    function pick(pref, n) {
      var r = pref.filter(function (c) { return cs.indexOf(c) >= 0; }).slice(0, n);
      return r.length ? r : [cs[0]];
    }
    var outs = m.assessOut;
    function firstOut(pref) {
      for (var i = 0; i < pref.length; i++) if (outs.indexOf(pref[i]) >= 0) return pref[i];
      return outs[0];
    }
    return {
      org:       { comps: pick(["I.6","e.14","g.11"], 1),                                              assess: "obs",   type: "form" },
      actual:    { comps: pick(["I.8","e.1","d.1","d.2","g.5","g.9","I.7"], 2),                        assess: m.assessIn, type: "diag" },
      goal:      { comps: pick(["I.9","e.12","e.8"], 1),                                               assess: "self",  type: "form" },
      "new":     { comps: pick(["I.6","d.20","d.1","d.2","d.3","d.5","d.4","g.4","I.5"], 3),          assess: "peer",  type: "form" },
      reinforce: { comps: pick(["I.8","I.9","d.20","d.3","d.18"], 2),                                  assess: outs.indexOf("auto") >= 0 ? "auto" : "quest", type: "form" },
      diffibl:   { comps: pick(["e.15","d.20","g.9","e.12","e.2","e.1","d.18","d.19","g.4","g.5","d.3"], 3), assess: firstOut(["data","auth","peer","self"]), type: "form" },
      funclit:   { comps: pick(["g.1","e.1","d.19","g.5","g.4","e.13","I.3","I.8"], 2),               assess: firstOut(["peer","auth","self","data"]), type: "form" },
      reflect:   { comps: pick(["I.9","I.7","e.15","I.8"], 2),                                         assess: "self",  type: "summ" },
      home:      { comps: pick(["I.9","e.15","d.1"], 1),                                               assess: null,    type: null }
    };
  }

<script>window.SCAFFOLD_BANK=[{"id":"B1","m":1,"q":"Какова основная идея технологии Scaffold?","o":["Временная помощь, предоставляемая учащимся","Полная независимость учащихся в обучении","Использование только теоретических знаний","Оценка знаний без поддержки","Использование исключительно цифровых ресурсов в обучении"],"a":0,"qk":"Scaffold технологиясының негізгі идеясы қандай?","ok":["Білім алушыларға көрсетілетін уақытша көмек","Білім алушылардың оқуда толық тәуелсіздігі","Тек теориялық білімді пайдалану","Қолдаусыз білімді бағалау","Оқытуда тек цифрлық ресурстарды пайдалану"]},{"id":"B2","m":1,"q":"Какие ключевые компетенции развивает технология Scaffold?","o":["Технические навыки.","Критическое мышление и способность к решению проблем.","Умение запоминать информацию.","Способность к механическому обучению.","Только коммуникативные навыки"],"a":1,"qk":"Scaffold технологиясы қандай негізгі құзыреттерді дамытады?","ok":["Техникалық дағдылар.","Сыни тұрғыдан ойлау және мәселелерді шешу қабілеті.","Ақпаратты жаттап алу қабілеті.","Механикалық оқу қабілеті.","Тек коммуникативтік дағдылар"]},{"id":"B3","m":1,"q":"Сколько групп карточек включает инструмент Scaffold?","o":["3","10","7","5","15"],"a":3,"qk":"Scaffold құралында карточкалардың қанша тобы бар?","ok":["3","10","7","5","15"]},{"id":"B4","m":1,"q":"Кто является авторами инструмента Scaffold?","o":["Команда учеников из разных стран","Преподаватели университетов","Эксперты Европейского фонда обучения и Объединенного исследовательского центра","Только исследователи из США","нет правильного ответа"],"a":2,"qk":"Scaffold құралының авторлары кімдер?","ok":["Әртүрлі елдердің білім алушыларынан құралған команда","Университет оқытушылары","Еуропалық оқыту қоры мен Бірлескен зерттеу орталығының сарапшылары","Тек АҚШ зерттеушілері","Дұрыс жауап жоқ"]},{"id":"B5","m":1,"q":"Какой принцип технологии Scaffold поддерживает развитие эмоционального обучения?","o":["Студентоцентрированное обучение","Включение триггеров для эмоционального обучения","Оценивание прогресса с помощью различных методов","Создание образовательного процесса открытым для общества","Принцип ускоренного усвоения материала"],"a":1,"qk":"Scaffold технологиясының қандай принципі эмоционалдық оқытудың дамуын қолдайды?","ok":["Білім алушыға бағытталған оқыту","Эмоционалдық оқытуға арналған триггерлерді енгізу","Прогресті түрлі әдістермен бағалау","Білім беру процесін қоғамға ашық ету","Материалды жеделдетіп меңгеру принципі"]},{"id":"B6","m":1,"q":"Что необходимо для успешного применения технологии Scaffold?","o":["Гибкость и адаптация учебного процесса под потребности каждого обучающегося","Строгое следование традиционным методам обучения","Изучение только теории","Игнорирование обратной связи от студентов","Отказ от использования цифровых инструментов"],"a":0,"qk":"Scaffold технологиясын табысты қолдану үшін не қажет?","ok":["Оқу процесінің икемділігі және оны әр білім алушының қажеттіліктеріне бейімдеу","Дәстүрлі оқыту әдістерін қатаң ұстану","Тек теорияны оқу","Білім алушылардың кері байланысын елемеу","Цифрлық құралдарды пайдаланудан бас тарту"]},{"id":"B7","m":1,"q":"Какую функцию выполняют карточки «Задание» в инструменте Scaffold?","o":["Помогают оценить успех студентов.","Содержат информацию о компетенциях.","Предлагают методы обучения.","Определяют учебную среду и собирают первоначальную информацию","Предназначены для итоговой аттестации"],"a":3,"qk":"Scaffold құралында «Тапсырма» карточкалары қандай қызмет атқарады?","ok":["Білім алушылардың жетістіктерін бағалауға көмектеседі.","Құзыреттер туралы ақпаратты қамтиды.","Оқыту әдістерін ұсынады.","Оқу ортасын анықтайды және бастапқы ақпаратты жинайды","Қорытынды аттестациялауға арналған"]},{"id":"B8","m":1,"q":"Что содержится в карточках «Планирование»?","o":["Действия для построения занятия, начиная с выбора компетенций.","Инструкции по оцениванию.","Библиотека методов обучения.","Информация о студентах.","Список тем для внеурочной деятельности"],"a":0,"qk":"«Жоспарлау» карточкаларында не бар?","ok":["Құзыреттерді таңдаудан басталатын сабақты құруға арналған әрекеттер.","Бағалау бойынша нұсқаулықтар.","Оқыту әдістерінің кітапханасы.","Білім алушылар туралы ақпарат.","Сабақтан тыс іс-шараларға арналған тақырыптар тізімі"]},{"id":"B9","m":1,"q":"Какова основная цель карточек «Методы обучения»?","o":["Собирать информацию о студентах.","Предоставить библиотеку педагогических подходов.","Оценивать знания студентов.","Определять цели занятия.","Предоставить информацию о структуре колледжа."],"a":1,"qk":"«Оқыту әдістері» карточкаларының басты мақсаты қандай?","ok":["Білім алушылар туралы ақпарат жинау.","Педагогикалық тәсілдер кітапханасын ұсыну.","Білім алушылардың білімін бағалау.","Сабақтың мақсаттарын анықтау.","Колледждің құрылымы туралы ақпарат беру."]},{"id":"B10","m":1,"q":"Что предлагают карточки «Методы оценки»?","o":["Только формирующие методы оценки.","Различные методы для диагностического, формирующего или итогового оценивания.","Методы оценки только в конце занятия.","Инструкции по планированию занятий.","Примерные тесты и задания для студентов."],"a":1,"qk":"«Бағалау әдістері» карточкалары не ұсынады?","ok":["Тек қалыптастырушы бағалау әдістерін.","Диагностикалық, қалыптастырушы немесе жиынтық бағалауға арналған әртүрлі әдістерді.","Тек сабақ соңындағы бағалау әдістерін.","Сабақты жоспарлау бойынша нұсқауларды.","Білім алушыларға арналған үлгі тесттер мен тапсырмаларды."]},{"id":"B11","m":1,"q":"Какие компетенции представлены в карточках «Компетенции»?","o":["Компетенции четырех рамок Европейского союза.","Только личные навыки.","Исключительно профессиональные навыки.","Лишь цифровые компетенции.","Навыки работы с различными учебными материалами"],"a":0,"qk":"«Құзыреттер» карточкаларында қандай құзыреттер берілген?","ok":["Еуропалық Одақтың төрт шеңберінің құзыреттері.","Тек жеке дағдылар.","Тек кәсіби дағдылар.","Тек цифрлық құзыреттер.","Түрлі оқу материалдарымен жұмыс істеу дағдылары"]},{"id":"B12","m":1,"q":"Какова особенность расположения информации на карточках в наборе Scaffold?","o":["Все карточки расположены вертикально.","Горизонтальные карточки предназначены только для оценки.","Все карточки содержат одинаковую информацию.","Горизонтальные карточки используются для планирования, вертикальные — для выбора компетенций.","Все карточки расположены горизонтально."],"a":3,"qk":"Scaffold жинағындағы карточкаларда ақпараттың орналасуының қандай ерекшелігі бар?","ok":["Барлық карточкалар тігінен орналасқан.","Көлденең карточкалар тек бағалауға арналған.","Барлық карточкаларда бірдей ақпарат бар.","Көлденең карточкалар жоспарлауға, тік карточкалар құзыреттерді таңдауға арналған.","Барлық карточкалар көлденеңінен орналасқан."]},{"id":"B13","m":1,"q":"Какую информацию можно найти на горизонтальных карточках?","o":["Методы оценки.","Личностные качества студентов.","Общую картину и структуру плана занятия.","Педагогические подходы.","Методы обучения"],"a":2,"qk":"Көлденең карточкалардан қандай ақпаратты табуға болады?","ok":["Бағалау әдістерін.","Білім алушылардың жеке қасиеттерін.","Сабақ жоспарының жалпы көрінісі мен құрылымын.","Педагогикалық тәсілдерді.","Оқыту әдістерін"]},{"id":"B14","m":1,"q":"Какую роль играют вертикальные карточки в инструменте Scaffold?","o":["Предоставляют возможность выбирать компетенции и методы обучения, оценивания.","Используются для оценки студентов.","Содержат информацию о времени занятий.","Определяют цели учебного процесса.","Определяют методы обучения."],"a":0,"qk":"Scaffold құралында тік карточкалар қандай рөл атқарады?","ok":["Құзыреттерді, оқыту және бағалау әдістерін таңдауға мүмкіндік береді.","Білім алушыларды бағалау үшін пайдаланылады.","Сабақ уақыты туралы ақпаратты қамтиды.","Оқу процесінің мақсаттарын анықтайды.","Оқыту әдістерін анықтайды."]},{"id":"B15","m":1,"q":"Какая из следующих рамок не входит в карточки «Компетенции»?","o":["Рамка цифровых компетенций (DigComp).","Рамка личностных и социальных компетенций (LifeComp).","Рамка компетенций в области устойчивого развития (GreenComp).","Рамка спортивных навыков.","Рамка предпринимательские компетенции (EntreComp)."],"a":3,"qk":"Төмендегі шеңберлердің қайсысы «Құзыреттер» карточкаларына кірмейді?","ok":["Цифрлық құзыреттер шеңбері (DigComp).","Жеке және әлеуметтік құзыреттер шеңбері (LifeComp).","Тұрақты даму құзыреттері шеңбері (GreenComp).","Спорттық дағдылар шеңбері.","Кәсіпкерлік құзыреттер шеңбері (EntreComp)."]},{"id":"B16","m":1,"q":"Что позволяет установить взаимосвязь между компетенциями в карточках «Компетенции»?","o":["Сравнивать успехи студентов.","Выбирать необходимые компетенции и находить оригинальные связи между ними.","Оценивать качество преподавания.","Определять время занятий.","нет правильного ответа."],"a":1,"qk":"«Құзыреттер» карточкаларындағы құзыреттердің өзара байланысын орнатуға не мүмкіндік береді?","ok":["Білім алушылардың жетістіктерін салыстыруға.","Қажетті құзыреттерді таңдап, олардың арасындағы бірегей байланыстарды табуға.","Оқыту сапасын бағалауға.","Сабақ уақытын анықтауға.","Дұрыс жауап жоқ."]},{"id":"B17","m":1,"q":"Какой из перечисленных аспектов не является частью проектно-ориентированного обучения?","o":["Навыки совместной работы.","Самостоятельность и ответственность.","Оценка через действие.","Пассивное восприятие информации.","Презентация результатов работы проекта."],"a":3,"qk":"Төменде аталған аспектілердің қайсысы жобаға бағытталған оқытудың бөлігі болып табылмайды?","ok":["Бірлесіп жұмыс істеу дағдылары.","Өзіндік жұмыс және жауапкершілік.","Әрекет арқылы бағалау.","Ақпаратты енжар қабылдау.","Жоба жұмысының нәтижелерін таныстыру."]},{"id":"B18","m":1,"q":"Как проектно-ориентированное обучение способствует подготовке к реальной жизни?","o":["Обучая студентов запоминать информацию","Предоставляя опыт решения сложных задач в профессиональной сфере","Ограничивая студентов в выборе тем","Сосредоточившись на теоретических знаниях","Студенты работают над задачами, которые могут быть решены только с помощью традиционных методов"],"a":1,"qk":"Жобаға бағытталған оқыту шынайы өмірге дайындалуға қалай ықпал етеді?","ok":["Білім алушыларды ақпаратты жаттап алуға үйрету арқылы","Кәсіби салада күрделі міндеттерді шешу тәжірибесін беру арқылы","Білім алушыларды тақырыпты таңдауда шектеу арқылы","Теориялық білімге ғана назар аудару арқылы","Білім алушылар тек дәстүрлі әдістермен ғана шешілетін міндеттермен жұмыс істейді"]},{"id":"B19","m":1,"q":"Каким образом личностно-ориентированное обучение влияет на мотивацию студентов?","o":["Студенты видят связь между учебным материалом и своими личными интересами, что делает обучение более значимым.","Студенты теряют интерес к учебе.","Учебный процесс становится более рутинным.","Студенты полагаются исключительно на внешние награды для мотивации.","Мотивация студентов остается на том же уровне, поскольку методы обучения не меняются."],"a":0,"qk":"Тұлғаға бағытталған оқыту білім алушылардың мотивациясына қалай әсер етеді?","ok":["Білім алушылар оқу материалы мен өздерінің жеке қызығушылықтары арасындағы байланысты көреді, бұл оқуды неғұрлым мағыналы етеді.","Білім алушылар оқуға деген қызығушылығын жоғалтады.","Оқу процесі неғұрлым рутиналық сипат алады.","Білім алушылар мотивация үшін тек сыртқы марапаттарға сүйенеді.","Оқыту әдістері өзгермейтіндіктен, білім алушылардың мотивациясы сол деңгейде қалады."]},{"id":"B20","m":1,"q":"Каким образом личностно-ориентированное обучение помогает студентам развивать самостоятельность?","o":["Студенты не имеют права выбирать темы для изучения.","Студенты принимают решения относительно своего образования и выбирают интересующие их проекты.","Преподаватели всегда контролируют каждый шаг студента.","Студенты работают только под руководством преподавателя.","Личностно-ориентированное обучение позволяет студентам работать в группах, что уменьшает их личную ответственность за результаты"],"a":1,"qk":"Тұлғаға бағытталған оқыту білім алушылардың дербестігін дамытуға қалай көмектеседі?","ok":["Білім алушылардың оқуға арналған тақырыптарды таңдауға құқығы жоқ.","Білім алушылар өз білімі туралы шешім қабылдайды және өздерін қызықтыратын жобаларды таңдайды.","Оқытушылар білім алушының әр қадамын әрдайым бақылайды.","Білім алушылар тек оқытушының басшылығымен жұмыс істейді.","Тұлғаға бағытталған оқыту білім алушыларға топта жұмыс істеуге мүмкіндік береді, бұл олардың нәтижелер үшін жеке жауапкершілігін азайтады"]},{"id":"B21","m":1,"q":"Какой из следующих аспектов педагогики создания ценностей способствует повышению уровня социальной активности обучающихся?","o":["Изучение теоретических основ педагогики.","Индивидуальная работа с учебными материалами","Проведение экзаменов и тестов.","Участие студентов в общественных проектах и акциях.","Снижение значимости общественных инициатив и активного участия студентов в социальных проектах."],"a":3,"qk":"Құндылыққа негізделген педагогиканың қандай аспектісі білім алушылардың әлеуметтік белсенділік деңгейін арттыруға ықпал етеді?","ok":["Педагогиканың теориялық негіздерін зерттеу.","Оқу материалдарымен жеке жұмыс","Емтихандар мен тесттер өткізу.","Білім алушылардың қоғамдық жобалар мен акцияларға қатысуы.","Қоғамдық бастамалардың және білім алушылардың әлеуметтік жобаларға белсенді қатысуының маңыздылығын төмендету."]},{"id":"B22","m":1,"q":"Какой из следующих аспектов обучения в сотрудничестве способствует развитию коммуникативных навыков у обучающихся?","o":["Индивидуальная работа над проектом.","Обсуждение и обмен мнениями в группах.","Чтение учебного материала в тишине.","Проведение тестов на скорость.","Минимизация групповых обсуждений и взаимодействий в ходе работы."],"a":1,"qk":"Ынтымақтастықта оқытудың қандай аспектісі білім алушылардың коммуникативтік дағдыларының дамуына ықпал етеді?","ok":["Жоба бойынша жеке жұмыс.","Топтарда талқылау және пікір алмасу.","Оқу материалын үнсіз оқу.","Жылдамдыққа тесттер өткізу.","Жұмыс барысында топтық талқылаулар мен өзара әрекеттестікті барынша азайту."]},{"id":"B23","m":1,"q":"Какое из следующих утверждений лучше всего описывает влияние групповой работы на критическое мышление?","o":["Групповая работа мешает развитию критического мышления.","Совместная работа ограничивает возможности для анализа информации.","Групповая работа способствует анализу различных точек зрения и выработке собственных выводов.","Группы всегда приходят к единому мнению без обсуждения.","Групповая работа помогает только в освоении теоретических знаний, а не в критическом анализе"],"a":2,"qk":"Төмендегі тұжырымдардың қайсысы топтық жұмыстың сыни тұрғыдан ойлауға әсерін ең жақсы сипаттайды?","ok":["Топтық жұмыс сыни тұрғыдан ойлаудың дамуына кедергі келтіреді.","Бірлескен жұмыс ақпаратты талдау мүмкіндіктерін шектейді.","Топтық жұмыс әртүрлі көзқарастарды талдауға және өз қорытындыларын жасауға ықпал етеді.","Топтар әрдайым талқылаусыз бір пікірге келеді.","Топтық жұмыс тек теориялық білімді меңгеруге көмектеседі, сыни талдауға көмектеспейді"]},{"id":"B24","m":1,"q":"Как лабораторные занятия помогают развивать критическое мышление у студентов?","o":["Они предоставляют готовые ответы на все вопросы.","Экспериментальная работа стимулирует интерес к предмету и развивает критическое мышление.","Лабораторные занятия не требуют анализа данных.","Студенты работают исключительно в одиночку без обсуждения результатов.","Они способствуют механическому запоминанию инструкций."],"a":1,"qk":"Зертханалық сабақтар білім алушылардың сыни тұрғыдан ойлауын дамытуға қалай көмектеседі?","ok":["Олар барлық сұрақтарға дайын жауаптар береді.","Эксперименттік жұмыс пәнге деген қызығушылықты арттырады және сыни тұрғыдан ойлауды дамытады.","Зертханалық сабақтар деректерді талдауды қажет етпейді.","Білім алушылар нәтижелерді талқыламай, тек жеке жұмыс істейді.","Олар нұсқауларды механикалық жаттауға ықпал етеді."]},{"id":"B25","m":1,"q":"Какое из следующих утверждений наиболее точно отражает цель сервисного обучения?","o":["Студенты осваивают методы исследований, планирования и организации мероприятий, что помогает им приобрести практические навыки.","Студенты только изучают теорию без практического применения.","Сервисное обучение не связано с развитием профессиональных навыков.","Студенты работают исключительно в одиночку и не взаимодействуют с обществом.","Подготовка студентов исключительно к сдаче экзаменов."],"a":0,"qk":"Төмендегі тұжырымдардың қайсысы қоғамдық қызмет элементтерімен практикалық оқытудың мақсатын ең нақты көрсетеді?","ok":["Білім алушылар зерттеу, жоспарлау және іс-шараларды ұйымдастыру әдістерін меңгереді, бұл оларға практикалық дағдыларды алуға көмектеседі.","Білім алушылар теорияны практикада қолданбай ғана оқиды.","Қоғамдық қызмет элементтерімен практикалық оқыту кәсіби дағдыларды дамытумен байланысты емес.","Білім алушылар тек жеке жұмыс істейді және қоғаммен өзара әрекеттеспейді.","Білім алушыларды тек емтихан тапсыруға дайындау."]},{"id":"B26","m":1,"q":"Какой из перечисленных методов оценки предполагает получение отзывов и оценок от других студентов?","o":["Самоанализ","Наблюдение","Обратная связь от сверстников","Автоматизированная оценка","нет правильного ответа."],"a":2,"qk":"Төменде аталған бағалау әдістерінің қайсысы басқа білім алушылардан пікір мен баға алуды көздейді?","ok":["Өзін-өзі тексеру","Бақылау","Құрдастардың кері байланысы","Автоматтандырылған бағалау","Дұрыс жауап жоқ."]},{"id":"B27","m":1,"q":"Какой метод оценки дает обучающимся возможность самостоятельно оценивать свои достижения и определять области для улучшения?","o":["Формирование оценочных данных","Аутентичная оценка","Самоанализ","Учебные вопросы","Наблюдение"],"a":2,"qk":"Қай бағалау әдісі білім алушыларға өз жетістіктерін өз бетінше бағалауға және жетілдіруге қажетті салаларды анықтауға мүмкіндік береді?","ok":["Бағалау деректерін қалыптастыру","Шынайы бағалау","Өзін-өзі тексеру","Зерттеуге арналған сұрақтар","Бақылау"]},{"id":"B28","m":1,"q":"Какой метод оценки предполагает использование реальных задач и ситуаций для оценки знаний и навыков студентов?","o":["Автоматизированная оценка","Наблюдение","Аутентичная оценка","Обратная связь от сверстников","Учебные вопросы"],"a":2,"qk":"Қай бағалау әдісі білім алушылардың білімі мен дағдыларын бағалау үшін нақты міндеттер мен жағдайларды пайдалануды көздейді?","ok":["Автоматтандырылған бағалау","Бақылау","Шынайы бағалау","Құрдастардың кері байланысы","Зерттеуге арналған сұрақтар"]},{"id":"B29","m":1,"q":"Какой из перечисленных методов помогает студентам анализировать работы других и развивать критическое мышление?","o":["Презентации с последующей оценкой","Метод «плюс-минус-интересно»","Групповая рецензия","Обратная связь от сверстников","Все вышеперечисленные ответы"],"a":4,"qk":"Төменде аталған әдістердің қайсысы білім алушыларға басқалардың жұмысын талдауға және сыни тұрғыдан ойлауды дамытуға көмектеседі?","ok":["Кейінгі бағалауы бар презентациялар","«Плюс-минус-қызықты» әдісі","Топтық рецензия","Құрдастардың кері байланысы","Жоғарыда аталғандардың барлығы"]},{"id":"B30","m":1,"q":"Какой из следующих вопросов помогает студентам провести самоанализ после выполнения задания?","o":["Какой у меня был план?","Что мне удалось хорошо в этой работе?","Что скажет преподаватель?","Какой материал я изучал?","Нет правильного ответа"],"a":1,"qk":"Төмендегі сұрақтардың қайсысы білім алушыларға тапсырманы орындағаннан кейін өзін-өзі талдауға көмектеседі?","ok":["Менің жоспарым қандай болды?","Осы жұмыста маған не жақсы шықты?","Мұғалім не дейді?","Мен қандай материалды оқыдым?","Дұрыс жауап жоқ"]},{"id":"B31","m":1,"q":"Какова основная цель метода формирование оценочных данных?","o":["Систематический сбор информации о прогрессе обучающихся","Поддержка преподавателей в работе","Увеличение количества заданий","Сравнение студентов между собой","Проведение тестирования без обратной связи"],"a":0,"qk":"Бағалау деректерін қалыптастыру әдісінің негізгі мақсаты қандай?","ok":["Білім алушылардың прогресі туралы ақпаратты жүйелі түрде жинау","Мұғалімдердің жұмысын қолдау","Тапсырмалар санын көбейту","Білім алушыларды бір-бірімен салыстыру","Кері байланыссыз тестілеу өткізу"]},{"id":"B32","m":1,"q":"Какой из следующих методов используется для сбора мнений студентов о курсе?","o":["Мониторинг производительности","Анализ результатов тестирования","Анкетирование и опросы","Проектные отчеты","Использование стандартного тестирования"],"a":2,"qk":"Төмендегі әдістердің қайсысы білім алушылардың курс туралы пікірін жинау үшін қолданылады?","ok":["Өнімділік мониторингі","Тестілеу нәтижелерін талдау","Анкета толтыру және сауалнамалар","Жоба есептері","Стандартты тестілеуді қолдану"]},{"id":"B33","m":1,"q":"Какое преимущество метода формирования оценочных данных связано с мотивацией студентов?","o":["Постоянное отслеживание прогресса мотивирует стремиться к лучшим результатам","Увеличение количества тестов и экзаменов","Сравнение с успехами сверстников","Изучение новых материалов","Исключает необходимость групповой работы"],"a":0,"qk":"Бағалау деректерін қалыптастыру әдісінің қандай артықшылығы білім алушылардың мотивациясымен байланысты?","ok":["Прогресті үнемі қадағалау жақсырақ нәтижелерге ұмтылуға ынталандырады","Тесттер мен емтихандар санын көбейту","Құрдастардың жетістіктерімен салыстыру","Жаңа материалдарды оқу","Топтық жұмыстың қажеттілігін жояды"]},{"id":"B34","m":1,"q":"Что такое аутентичное оценивание?","o":["Оценка теоретических знаний с помощью тестов","Оценка, основанная на выполнении реальных заданий и демонстрации компетенций","Оценка, проводимая только на экзаменах","Оценка, основанная на самооценке студентов","нет правильного ответа"],"a":1,"qk":"Шынайы бағалау дегеніміз не?","ok":["Теориялық білімді тесттер арқылы бағалау","Нақты тапсырмаларды орындауға және құзыреттерді көрсетуге негізделген бағалау","Тек емтихандарда жүргізілетін бағалау","Білім алушылардың өзін-өзі бағалауына негізделген бағалау","Дұрыс жауап жоқ"]},{"id":"B35","m":1,"q":"Какой из следующих методов является примером аутентичного оценивания?","o":["Тест на знание правил","Практический экзамен для получения водительских прав","Письменная работа по теоретическому материалу","Онлайн-опрос","Повторение определений наизусть"],"a":1,"qk":"Келесі әдістердің қайсысы шынайы бағалауға мысал бола алады?","ok":["Ережелерді білуге арналған тест","Жүргізуші куәлігін алуға арналған практикалық емтихан","Теориялық материал бойынша жазбаша жұмыс","Онлайн-сауалнама","Анықтамаларды жатқа қайталау"]},{"id":"B36","m":1,"q":"Какое преимущество аутентичного оценивания связано с практическим применением знаний?","o":["Упрощение процесса обучения","Сравнение студентов между собой","Увеличение количества тестов","Повышение интереса и вовлеченности студентов","Позволяет избежать необходимости групповой работы"],"a":3,"qk":"Шынайы бағалаудың білімді практикада қолдануға байланысты қандай артықшылығы бар?","ok":["Оқыту процесін жеңілдету","Білім алушыларды бір-бірімен салыстыру","Тесттер санын көбейту","Білім алушылардың қызығушылығы мен тартылуын арттыру","Топтық жұмыс қажеттілігінен аулақ болуға мүмкіндік береді"]},{"id":"B37","m":1,"q":"Почему аутентичное оценивание имеет значение для подготовки к будущей профессиональной деятельности?","o":["Оно позволяет студентам изучать только теорию","Оно помогает развивать навыки, необходимые в реальной жизни","Оно не учитывает интересы студентов","Оно оценивает только знания, но не умения","Основано на запоминании большого объема информации"],"a":1,"qk":"Шынайы бағалау болашақ кәсіби қызметке дайындық үшін неліктен маңызды?","ok":["Ол білім алушыларға тек теорияны оқуға мүмкіндік береді","Ол нақты өмірде қажетті дағдыларды дамытуға көмектеседі","Ол білім алушылардың қызығушылықтарын ескермейді","Ол тек білімді бағалайды, ал біліктілікті бағаламайды","Үлкен көлемдегі ақпаратты жаттауға негізделген"]},{"id":"B38","m":1,"q":"Что такое метод автоматизированной оценки?","o":["Оценка, проводимая вручную преподавателем","Оценка, использующая программные средства для автоматического анализа ответов студентов","Оценка, основанная  способствует развитию студентов?","o":["Упрощает процесс обучения, не требуя от студентов критического мышления","Помогает студентам овладеть конкретными знаниями и развивает навыки самообучения и саморегуляции","Оценивает студентов только на основе их теоретических знаний","Преподаватели не могут использовать его для оценки прогресса студентов","Снижает потребность в активном обучении и стимулирует студентов к пассивному восприятию информации."],"a":1,"qk":"Scaffold құралы білім алушылардың дамуына қалай ықпал етеді?","ok":["Білім алушылардан сыни тұрғыдан ойлауды талап етпей, оқу процесін жеңілдетеді","Білім алушыларға нақты білімді меңгеруге көмектеседі және өздігінен оқу мен өзін-өзі реттеу дағдыларын дамытады","Білім алушыларды тек теориялық білімі негізінде бағалайды","Педагогтер оны білім алушылардың жетістіктерін бағалау үшін пайдалана алмайды","Белсенді оқу қажеттілігін азайтады және білім алушыларды ақпаратты енжар қабылдауға ынталандырады."]},{"id":"B81","m":2,"q":"Какая из следующих компетенций НЕ входит в DigComp?","o":["Информационная грамотность","Безопасность","Коммуникация и взаимодействие","Управление проектами","Решение проблем"],"a":3,"qk":"Мына құзыреттердің қайсысы DigComp құрамына КІРМЕЙДІ?","ok":["Ақпараттық сауаттылық","Қауіпсіздік","Коммуникация және өзара әрекеттесу","Жобаларды басқару","Мәселелерді шешу"]},{"id":"B82","m":2,"q":"Как развитие цифровых компетенций влияет на карьерный рост?","o":["Обеспечивает стабильную работу в одной профессии","Открывает новые горизонты и возможности для карьерного роста","Уменьшает количество рабочих часов","Не влияет на карьерный рост","Требует дополнительных затрат времени, не принося ощутимых результатов."],"a":1,"qk":"Цифрлық құзыреттерді дамыту мансаптық өсуге қалай әсер етеді?","ok":["Бір мамандық бойынша тұрақты жұмысты қамтамасыз етеді","Мансаптық өсудің жаңа көкжиектері мен мүмкіндіктерін ашады","Жұмыс сағаттарының санын азайтады","Мансаптық өсуге әсер етпейді","Қосымша уақыт шығынын талап етеді, бірақ нақты нәтиже бермейді."]},{"id":"B83","m":2,"q":"Что включает в себя устойчивое развитие?","o":["Только заботу об окружающей среде","Снижение численности населения","Развитие только в экономической сфере","Удовлетворение потребностей настоящего поколения, не ущемляя возможности будущих поколений","Развитие только в цифровой сфере"],"a":3,"qk":"Тұрақты даму нені қамтиды?","ok":["Тек қоршаған ортаға қамқорлық жасауды","Халық санын азайтуды","Тек экономикалық салада дамуды","Болашақ ұрпақтың мүмкіндіктерін шектемей, қазіргі ұрпақтың қажеттіліктерін қанағаттандыруды","Тек цифрлық салада дамуды"]},{"id":"B84","m":2,"q":"Какие аспекты включает в себя развитие компетенций в области устойчивого развития?","o":["Знания, навыки и позиции, необходимые для устойчивого развития","Только знания об окружающей среде","Только навыки, связанные с экономикой","Только теоретическое понимание проблем","Только практический подход к решению проблем"],"a":0,"qk":"Тұрақты даму саласындағы құзыреттерді дамыту қандай аспектілерді қамтиды?","ok":["Тұрақты даму үшін қажетті білім, дағдылар мен ұстанымдар","Тек қоршаған орта туралы білім","Тек экономикаға байланысты дағдылар","Тек мәселелерді теориялық түсіну","Мәселелерді шешудің тек практикалық тәсілі"]},{"id":"B85","m":2,"q":"Какова основная цель компетенций в области устойчивого развития (GreenComp)?","o":["Развитие только в социальной сфере","Обеспечение долгосрочного и гармоничного прогресса общества","Создание новых экономических возможностей","Улучшение качества образования","Развитие только в цифровой сфере"],"a":1,"qk":"Тұрақты даму құзыреттерінің (GreenComp) негізгі мақсаты қандай?","ok":["Тек әлеуметтік салада дамуды қамтамасыз ету","Қоғамның ұзақ мерзімді және үйлесімді ілгерілеуін қамтамасыз ету","Жаңа экономикалық мүмкіндіктер құру","Білім сапасын жақсарту","Тек цифрлық салада дамуды қамтамасыз ету"]},{"id":"B86","m":2,"q":"Какие метанавыки важны для личностной и профессиональной эффективности в условиях меняющегося мира? ерность двух источников об одном событии и обосновывает собственный вывод».","qk":"Қай құзырет осы нәтижені ең жақсы көрсетеді?","ok":["I.8 Сыни тұрғыдан ойлау","I.3 Әл-ауқат","I.4 Эмпатия","e.9 Қаржылық және экономикалық сауаттылық","d.9 Сандық сәйкестікті басқару"],"ck":"Тарих сабағы. Күтілетін нәтиже: «Бір оқиға туралы екі дереккөздің шынайылығын бағалайды және өз қорытындысын негіздейді»."},{"id":"U3","m":3,"q":"В какую карточку планирования при составлении плана занятия записывают такой критерий?","o":["№1 «Выберите компетенции»","№3 «Выберите метод обучения»","№6 «Сбор ресурсов»","№4 «Ожидаемые результаты / индикаторы»","№7 «Хронология»"],"a":3,"c":"Урок математики. Критерий успеха: «Составляет бюджет семьи и верно вычисляет долю расходов в процентах».","qk":"Сабақ жоспарын құрастыру кезінде мұндай өлшемшарт қай жоспарлау карточкасына жазылады?","ok":["№1 «Құзыреттерді таңдаңыз»","№3 «Оқыту әдісін таңдаңыз»","№6 «Ресурстарды жинау»","№4 «Нәтижелер / нақты материалдар»","№7 «Хронология»"],"ck":"Математика сабағы. Жетістік өлшемшарты: «Отбасы бюджетін құрастырады және шығыстар үлесін пайызбен дұрыс есептейді»."},{"id":"U4","m":3,"q":"В какую карточку «Задание» записывают эти сведения?","o":["«Цель»","«Длительность»","«Ресурсы»","«Место»","«Целевая аудитория»"],"a":1,"c":"Урок географии длится 45 минут.","qk":"Бұл мәліметтер қай «Тапсырма» карточкасына жазылады?","ok":["«Мақсаты»","«Ұзақтығы»","«Ресурстар»","«Өтетін орны»","«Мақсатты аудитория»"],"ck":"География сабағы 45 минутқа созылады."},{"id":"U5","m":3,"q":"В какую карточку «Задание» записывают эти сведения?","o":["«Тема»","«Ресурсы»","«Место»","«Цель»","«Потребности»"],"a":4,"c":"В классе есть ученики, которым для изучения нужны дополнительное время, подсказки и задания трёх уровней сложности.","qk":"Бұл мәліметтер қай «Тапсырма» карточкасына жазылады?","ok":["«Тақырыбы»","«Ресурстар»","«Өтетін орны»","«Мақсаты»","«Қажеттіліктер»"],"ck":"Сыныпта оқу үшін қосымша уақыт, кеңестер және күрделілігі үш деңгейлі тапсырмалар қажет оқушылар бар."},{"id":"U6","m":3,"q":"В какую карточку «Задание» записывают такой контекст?","o":["«Тема»","«Связь с реальной жизнью»","«Цель»","«Ресурсы»","«Место»"],"a":1,"c":"Урок математики «Проценты в семейном бюджете»: ученики считают скидки и расходы своей семьи.","qk":"Мұндай контекст қай «Тапсырма» карточкасына жазылады?","ok":["«Тақырыбы»","«Шынайы өмірмен байланысы»","«Мақсаты»","«Ресурстар»","«Өтетін орны»"],"ck":"«Отбасылық бюджеттегі пайыздар» математика сабағы: оқушылар өз отбасының жеңілдіктері мен шығыстарын есептейді."},{"id":"U7","m":3,"q":"Какую карточку планирования следует взять следующей?","o":["№5 «Выберите метод оценки»","№6 «Сбор ресурсов»","№7 «Хронология»","№3 «Выберите метод обучения»","№4 «Ожидаемые результаты / индикаторы»"],"a":3,"c":"Урок информатики. Учитель уже выбрал компетенции (карточка планирования №1) и определил их начальный уровень (карточка №2).","qk":"Келесі қай жоспарлау карточкасын алу керек?","ok":["№5 «Бағалау әдісін таңдаңыз»","№6 «Ресурстарды жинау»","№7 «Хронология»","№3 «Оқыту әдісін таңдаңыз»","№4 «Нәтижелер / нақты материалдар»"],"ck":"Информатика сабағы. Мұғалім құзыреттерді (№1 жоспарлау карточкасы) таңдап, олардың бастапқы деңгейін (№2 карточка) анықтап қойған."},{"id":"U8","m":3,"q":"Какой метод оценки Scaffold использует учитель?","o":["Учебные вопросы","Автоматизированное оценивание","Самоанализ (самопроверка)","Формирование данных оценки","Аутентичное оценивание"],"a":0,"c":"Урок основ права «Права потребителя». Перед изучением темы учитель задаёт серию вопросов, чтобы выявить представления учеников и вызвать обсуждение.","qk":"Мұғалім Scaffold-тың қай бағалау әдісін қолданады?","ok":["Зерттеуге арналған сұрақтар","Автоматтандырылған бағалау","Өзін-өзі тексеру","Бағалау деректерін қалыптастыру","Шынайы бағалау"],"ck":"«Тұтынушы құқықтары» құқық негіздері сабағы. Тақырыпты оқып-үйренер алдында мұғалім оқушылардың түсініктерін анықтау және талқылау тудыру үшін бірқатар сұрақтар қояды."},{"id":"U9","m":3,"q":"Какой метод оценки Scaffold применён?","o":["Автоматизированное оценивание","Наблюдение","Самоанализ (самопроверка)","Аутентичное оценивание","Обратная связь от сверстников"],"a":4,"c":"Урок русского языка. Ученики написали статью для школьного сайта, обменялись текстами, назвали, что получилось, и предложили один шаг для улучшения.","qk":"Scaffold-тың қай бағалау әдісі қолданылған?","ok":["Автоматтандырылған бағалау","Бақылау","Өзін-өзі тексеру","Шынайы бағалау","Құрдастардың кері байланысы"],"ck":"Орыс тілі сабағы. Оқушылар мектеп сайтына арналған мақала жазды, мәтіндерімен алмасты, нені жақсы орындағанын атап, жақсарту үшін бір қадам ұсынды."},{"id":"U10","m":3,"q":"Какой метод оценки Scaffold описан?","o":["Автоматизированное оценивание","Наблюдение","Аутентичное оценивание","Формирование данных оценки","Обратная связь от сверстников"],"a":2,"c":"Урок технологии. Ученики планируют ремонт школьной скамьи: берут реальные размеры и цены материалов и показывают, как применять знания в настоящей ситуации.","qk":"Scaffold-тың қай бағалау әдісі сипатталған?","ok":["Автоматтандырылған бағалау","Бақылау","Шынайы бағалау","Бағалау деректерін қалыптастыру","Құрдастардың кері байланысы"],"ck":"Технология сабағы. Оқушылар мектеп орындығын жөндеуді жоспарлайды: нақты өлшемдер мен материалдардың бағаларын алып, білімді нақты жағдайда қалай қолдануға болатынын көрсетеді."},{"id":"U11","m":3,"q":"Какой метод оценки Scaffold описан?","o":["Автоматизированное оценивание","Самоанализ (самопроверка)","Аутентичное оценивание","Учебные вопросы","Наблюдение"],"a":0,"c":"Ученики проходят онлайн-тест, результаты которого автоматически проверяет программа.","qk":"Scaffold-тың қай бағалау әдісі сипатталған?","ok":["Автоматтандырылған бағалау","Өзін-өзі тексеру","Шынайы бағалау","Зерттеуге арналған сұрақтар","Бақылау"],"ck":"Оқушылар онлайн-тест тапсырады, оның нәтижесін бағдарлама автоматты түрде тексереді."},{"id":"U12","m":3,"q":"Какой метод оценки Scaffold описан?","o":["Обратная связь от сверстников","Автоматизированное оценивание","Наблюдение","Самоанализ (самопроверка)","Учебные вопросы"],"a":3,"c":"Урок английского языка. После выполнения задания ученик письменно отвечает: «Что у меня получилось? Что бы я изменил в следующий раз?»","qk":"Scaffold-тың қай бағалау әдісі сипатталған?","ok":["Құрдастардың кері байланысы","Автоматтандырылған бағалау","Бақылау","Өзін-өзі тексеру","Зерттеуге арналған сұрақтар"],"ck":"Ағылшын тілі сабағы. Тапсырманы орындағаннан кейін оқушы жазбаша жауап береді: «Менде не жақсы шықты? Келесі жолы нені өзгертер едім?»"},{"id":"U13","m":3,"q":"Какой метод оценки Scaffold описан?","o":["Автоматизированное оценивание","Наблюдение","Обратная связь от сверстников","Самоанализ (самопроверка)","Формирование данных оценки"],"a":1,"c":"Урок физической культуры. Учитель по заранее заданным критериям отмечает, как ученики распределяют роли и действуют в группе, без формального тестирования.","qk":"Scaffold-тың қай бағалау әдісі сипатталған?","ok":["Автоматтандырылған бағалау","Бақылау","Құрдастардың кері байланысы","Өзін-өзі тексеру","Бағалау деректерін қалыптастыру"],"ck":"Дене шынықтыру сабағы. Мұғалім алдын ала белгіленген өлшемшарттар бойынша оқушылардың рөлдерді қалай бөлісетінін және топта қалай әрекет ететінін ресми тестілеусіз белгілейді."},{"id":"U14","m":3,"q":"Какой метод обучения Scaffold описан?","o":["Игровое обучение","Лабораторный метод обучения","Обучение в сотрудничестве","Личностно-ориентированное обучение","Проектно-ориентированное обучение"],"a":4,"c":"Урок технологии. Ученики самостоятельно проектируют и изготавливают полезную вещь из вторсырья и презентуют результат классу.","qk":"Scaffold-тың қай оқыту әдісі сипатталған?","ok":["Ойын арқылы оқыту","Оқытудың зертханалық әдісі","Ынтымақтастықта оқыту","Тұлғаға бағытталған оқыту","Жобаға бағытталған оқыту"],"ck":"Технология сабағы. Оқушылар қайталама шикізаттан пайдалы бұйымды өздері жобалап, жасайды және нәтижені сыныпқа таныстырады."},{"id":"U15","m":3,"q":"Какой метод обучения Scaffold описан?","o":["Проектно-ориентированное обучение","Игровое обучение","Личностно-ориентированное обучение","Практическое обучение с элементами общественной службы","Лабораторный метод обучения"],"a":2,"c":"Урок литературы. Каждый ученик выбирает собственную тему исследования в соответствии со своими интересами и сам решает, как её раскрыть.","qk":"Scaffold-тың қай оқыту әдісі сипатталған?","ok":["Жобаға бағытталған оқыту","Ойын арқылы оқыту","Тұлғаға бағытталған оқыту","Қоғамдық қызмет элементтерімен практикалық оқыту","Оқытудың зертханалық әдісі"],"ck":"Әдебиет сабағы. Әрбір оқушы өз қызығушылығына сәйкес зерттеудің жеке тақырыбын таңдайды және оны қалай ашуды өзі шешеді."},{"id":"U16","m":3,"q":"Какой метод обучения Scaffold описан?","o":["Лабораторный метод обучения","Игровое обучение","Личностно-ориентированное обучение","Проектно-ориентированное обучение","Практическое обучение с элементами общественной службы"],"a":4,"c":"Урок самопознания. Старшеклассники готовят и проводят для младших школьников занятие о здоровом образе жизни.","qk":"Scaffold-тың қай оқыту әдісі сипатталған?","ok":["Оқытудың зертханалық әдісі","Ойын арқылы оқыту","Тұлғаға бағытталған оқыту","Жобаға бағытталған оқыту","Қоғамдық қызмет элементтерімен практикалық оқыту"],"ck":"Өзін-өзі тану сабағы. Жоғары сынып оқушылары бастауыш сынып оқушылары үшін салауатты өмір салты туралы сабақ дайындап, өткізеді."},{"id":"U17","m":3,"q":"Какой метод обучения Scaffold описан?","o":["Обучение в сотрудничестве","Игровое обучение","Лабораторный метод обучения","Личностно-ориентированное обучение","Педагогика создания ценностей"],"a":0,"c":"Урок биологии. Группы по четыре ученика с распределёнными ролями работают над общим плакатом и общим выводом.","qk":"Scaffold-тың қай оқыту әдісі сипатталған?","ok":["Ынтымақтастықта оқыту","Ойын арқылы оқыту","Оқытудың зертханалық әдісі","Тұлғаға бағытталған оқыту","Құндылыққа негізделген педагогика"],"ck":"Биология сабағ
